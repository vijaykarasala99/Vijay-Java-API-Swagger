# application name shown in logs / actuator
spring.application.name=VijayFullStackApp

# server port where application runs
server.port=9191

# MySQL database connection URL
spring.datasource.url=jdbc:mysql://localhost:3306/aaa
spring.datasource.username=root
spring.datasource.password=Vijay@2001

# MySQL JDBC driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate dialect for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# auto create/update tables based on entities (during development)
spring.jpa.hibernate.ddl-auto=update

# show SQL queries in console
spring.jpa.show-sql=true

# format SQL queries for readability
spring.jpa.properties.hibernate.format_sql=true

# maximum DB connections in pool
spring.datasource.hikari.maximum-pool-size=10

# minimum idle connections kept ready
spring.datasource.hikari.minimum-idle=5

# idle connection timeout
spring.datasource.hikari.idle-timeout=30000

# connection pool name
spring.datasource.hikari.pool-name=HikariPool

# spring framework logging level
logging.level.org.springframework=INFO

# print SQL queries
logging.level.org.hibernate.SQL=DEBUG

# print SQL parameter values
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# pretty print JSON responses
spring.jackson.serialization.indent-output=true

# expose all actuator endpoints
management.endpoints.web.exposure.include=*

# max file upload size
spring.servlet.multipart.max-file-size=500MB

# max request upload size
spring.servlet.multipart.max-request-size=500MB

# disable Spring Boot startup banner
spring.main.banner-mode=console
